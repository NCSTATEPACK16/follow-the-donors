# This repo is a monorepo: the Python data pipeline lives at the root and
# the frontend lives in web/. Netlify only ever builds and serves web/.
[build]
base = "web"
# web/public/data is gitignored, so a git checkout has no artifacts.
# fetch-data downloads the ones scripts/publish_data.sh uploaded to the
# repo's `data` GitHub Release; require-data then refuses to build if any is
# missing. A failed build publishes nothing, so the last good deploy stays
# live instead of a map that 404s.
command = "node scripts/fetch-data.mjs && node scripts/require-data.mjs && npm run build"
publish = "dist"

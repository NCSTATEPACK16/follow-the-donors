# This repo is a monorepo: the Python data pipeline lives at the root and
# the frontend lives in web/. Netlify only ever builds and serves web/.
[build]
base = "web"
# require-data refuses to build when web/public/data is absent, which it is
# in any git checkout (it is gitignored). A failed build publishes nothing,
# so the last good deploy stays live instead of a map that 404s.
command = "node scripts/require-data.mjs && npm run build"
publish = "dist"
